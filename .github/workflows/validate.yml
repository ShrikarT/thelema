name: THELEMA private compiler validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - ci/**
      - apps/**
      - packages/**
      - services/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - THELEMA-COMPLETION-TASK.md
permissions:
  contents: read
concurrency:
  group: thelema-private-validation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Verify private destination and import checksum-verified source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/import-source.py
  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kind: [node, contracts, cre, arc-public]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        if: matrix.kind == 'contracts' || matrix.kind == 'node'
        with:
          version: '1.8.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.kind == 'cre'
        with:
          bun-version: '1.3.8'
      - name: Execute actual checks and retain exit codes
        env:
          VALIDATION_KIND: ${{ matrix.kind }}
          VALIDATION_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: python3 ci/run-validation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-${{ matrix.kind }}
          path: |
            docs/evidence/ci/
            packages/cre/dist/
            packages/contracts/out/
            package-lock.json
            packages/cre/package-lock.json
          if-no-files-found: warn
          retention-days: 7
  publish-evidence:
    if: always()
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: validation-*
          path: .ci-artifacts
      - name: Record observed results without approving a release
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          PREPARE_OUTCOME: ${{ needs.prepare.result }}
          VALIDATE_OUTCOME: ${{ needs.validate.result }}
        run: python3 ci/publish-evidence.py
