name: THELEMA CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: thelema-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: '1.8.1'

      - name: Build application
        run: npm run build

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Unit & Invariant Tests (232 tests)
        run: npm test

      - name: Foundry Contract Invariant Tests (24 tests)
        run: npm run test:contracts

      - name: CRE Bridge Gateway & Crypto Tests
        run: |
          npm run test:bridge
          npm run test:bridge:crypto

      - name: Sponsor Verifiers
        run: |
          npm run verify:cre
          npm run verify:graph
