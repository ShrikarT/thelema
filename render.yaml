services:
  - type: web
    name: thelema
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node apps/web/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: APP_HOST
        value: thelema.onrender.com
      - key: APP_ORIGIN
        value: https://thelema.onrender.com
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.io
      - key: ARC_USDC
        value: "0x3600000000000000000000000000000000000000"
      - key: ARC_ORACLE
        value: "0x648d135701667547e674b087f8b2c28adc053ee1"
      - key: ARC_BINARY_VAULT
        value: "0x787c65cfcff30ea1e04a63ffab57ef42b0120ab7"
      - key: ARC_SHARE_VAULT
        value: "0x07e657d074e3b2e5a575b3bc30faf4c65f85edea"
      - key: ARC_BINARY_AMM
        value: "0x84fd754f3c10af24d5d4e38be1853f0cd14525a1"
      - key: ARC_YES_SHARE_AMM
        value: "0xa6b29a7971dd8773dda804b98c1b348efd7ddf8a"
      - key: ARC_NO_SHARE_AMM
        value: "0xdeb8cda6be867bf903b74575c9b81d405a3a2ab5"
      - key: CRE_CLIP_URL
        value: https://thelema-bridge.onrender.com/v1/clip
      - key: CRE_CLIP_ALLOWED_HOST
        value: thelema-bridge.onrender.com
      - key: CRE_CLIP_TOKEN
        sync: false
      - key: GRAPH_API_KEY
        sync: false
      - key: GRAPH_PROBABILITY_SUBGRAPH_ID
        value: Bx1W4S7kDVxs9gC3s2G6DS8kdNBJNVhMviCtin2DiBp
      - key: GRAPH_SPOT_SUBGRAPH_ID
        value: 5zvR82QoaXYFyDEKLZ9t6v9adgnptxYpKpSbxtgVENFV
      - key: GRAPH_SPOT_POOL_ID
        value: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"
      - key: GRAPH_SPOT_TOKEN_SYMBOL
        value: WETH
      - key: GRAPH_SPOT_ASSET
        value: ETH
      - key: GRAPH_SPOT_SCHEMA
        value: uniswap3
      - key: GRAPH_MAX_AGE_SECONDS
        value: 900
      - key: GRAPH_CROSS_PROTOCOL_ENABLED
        value: "true"

  - type: web
    name: thelema-bridge
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node services/cre-bridge/server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BRIDGE_PORT
        value: 10000
      - key: BRIDGE_BIND
        value: 0.0.0.0
      - key: BRIDGE_AUTH_TOKEN
        sync: false
      - key: CRE_CALLBACK_URL
        value: https://thelema-bridge.onrender.com/v1/callback
      - key: CRE_GATEWAY_REGISTRY
        value: private
      - key: CRE_WORKFLOW_ID
        sync: false
      - key: CRE_TRIGGER_SIGNER
        sync: false
      - key: CRE_TRIGGER_PRIVATE_KEY
        sync: false

